name: ✨ Feature Request
description: Propose a new feature, operator, or capability for Qarar
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Please share how this proposed capability improves the rules engine.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the limitation is (e.g., "I'm always frustrated when...")
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear description of the operator, API, or feature you are requesting.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
  - type: dropdown
    id: scope
    attributes:
      label: Target Package / Area
      options:
        - "@qarar/sdk (Builder & High-Level API)"
        - "@qarar/spec (New AST Operator / Types)"
        - "@qarar/engine-js (Evaluation Runtime)"
        - "@qarar/compiler-sql (SQL Query Pushdown)"
        - "@qarar/compiler-mongo (MongoDB Pushdown)"
        - "@qarar/react-builder (Visual Builder UI)"
        - "@qarar/docs (Documentation & Guides)"
