name: Publish SDK to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual npm publish)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  publish:
    name: Build, Test & Publish SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @qarar/sdk build

      - name: Test SDK
        run: pnpm --filter @qarar/sdk test

      - name: Publish SDK (dry run)
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "🏜️  Dry run mode - skipping npm publish"
          echo "Would publish @qarar/sdk to npm registry"

      - name: Publish SDK
        if: ${{ inputs.dry_run == 'false' }}
        run: pnpm --filter @qarar/sdk publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run smoke test
        if: ${{ inputs.dry_run == 'false' }}
        run: pnpm run smoke:sdk:published
        timeout-minutes: 5

      - name: Success summary
        if: ${{ inputs.dry_run == 'false' && success() }}
        run: |
          echo "✅ SDK published successfully to npm"
          echo ""
          echo "📦 Package: @qarar/sdk"
          echo "🔗 URL: https://www.npmjs.com/package/@qarar/sdk"
          echo ""
          echo "📖 View on npm to confirm README and version"

      - name: Dry run summary
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "✅ Dry run completed successfully"
          echo ""
          echo "All checks passed:"
          echo "  ✓ Dependencies installed"
          echo "  ✓ Build completed"
          echo "  ✓ Tests passed"
          echo ""
          echo "To publish for real, re-run without dry run flag"
