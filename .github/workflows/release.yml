name: Release & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (required if bump_type is custom, e.g., 0.1.0)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip npm publish and git commit)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Version, Tag & Publish
    runs-on: ubuntu-latest
    # Prevent infinite loop if commit message contains [skip ci] or is a release commit
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20 & npm registry auth
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification checks
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test

      - name: Determine Version Bump Strategy
        id: determine_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_TYPE="${{ inputs.bump_type }}"
            if [ "$BUMP_TYPE" = "custom" ]; then
              TARGET_VERSION="${{ inputs.custom_version }}"
              if [ -z "$TARGET_VERSION" ]; then
                echo "❌ custom_version input is required when bump_type is 'custom'"
                exit 1
              fi
              echo "target=$TARGET_VERSION" >> $GITHUB_OUTPUT
            else
              echo "target=$BUMP_TYPE" >> $GITHUB_OUTPUT
            fi
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            # Automated merge to main: check commit messages since last tag
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$LAST_TAG" ]; then
              COMMITS=$(git log --oneline -n 10)
            else
              COMMITS=$(git log ${LAST_TAG}..HEAD --oneline)
            fi

            echo "Commits since last tag:"
            echo "$COMMITS"

            # If commits contain breaking change -> major, if feat: -> minor, else -> patch
            if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|feat!:)"; then
              echo "Detected breaking change -> major bump"
              echo "target=major" >> $GITHUB_OUTPUT
            elif echo "$COMMITS" | grep -qE "feat(\([a-zA-Z0-9_-]+\))?:"; then
              echo "Detected new feature -> minor bump"
              echo "target=minor" >> $GITHUB_OUTPUT
            else
              echo "Standard change -> patch bump"
              echo "target=patch" >> $GITHUB_OUTPUT
            fi
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump Monorepo Package Versions
        id: bump
        run: |
          TARGET="${{ steps.determine_version.outputs.target }}"
          DRY_RUN="${{ steps.determine_version.outputs.dry_run }}"
          
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/bump-version.mjs "$TARGET" --dry-run
          else
            node scripts/bump-version.mjs "$TARGET"
          fi

      - name: Build Monorepo with Updated Versions
        run: pnpm run build

      - name: Commit Version Bump and Tag
        if: ${{ steps.determine_version.outputs.dry_run == 'false' }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          echo "Committing and tagging v${NEW_VERSION}..."
          
          git add -A
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin main --follow-tags

      - name: Publish Packages to npm
        if: ${{ steps.determine_version.outputs.dry_run == 'false' }}
        run: |
          echo "🚀 Publishing public workspace packages to npm..."
          pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Packages to npm (Dry Run)
        if: ${{ steps.determine_version.outputs.dry_run == 'true' }}
        run: |
          echo "🏜️ Dry-run mode: checking publishable packages..."
          pnpm -r publish --access public --dry-run --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ steps.determine_version.outputs.dry_run == 'false' }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          echo "Creating GitHub Release for v${NEW_VERSION}..."
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          DRY_RUN="${{ steps.determine_version.outputs.dry_run }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "$DRY_RUN" = "true" ]; then
            echo "🏜️ DRY RUN COMPLETE: Packages verified for v${NEW_VERSION}"
          else
            echo "🎉 RELEASE COMPLETE: v${NEW_VERSION} published successfully!"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
