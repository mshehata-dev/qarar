name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version strategy: current (keep version in package.json), patch, minor, major, custom'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (required only if bump_type is custom, e.g., 0.1.0)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (verify build & tests, check npm packages, skip git push and publish)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Version, Tag & Publish
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 & npm registry auth
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification checks
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test

      - name: Determine Target Version
        id: determine_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_TYPE="${{ inputs.bump_type }}"
            if [ "$BUMP_TYPE" = "custom" ]; then
              TARGET_VERSION="${{ inputs.custom_version }}"
              if [ -z "$TARGET_VERSION" ]; then
                echo "❌ custom_version input is required when bump_type is 'custom'"
                exit 1
              fi
              echo "target=$TARGET_VERSION" >> $GITHUB_OUTPUT
            else
              echo "target=$BUMP_TYPE" >> $GITHUB_OUTPUT
            fi
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Triggered by Git Tag push (e.g. refs/tags/v0.1.0)
            TAG_NAME="${GITHUB_REF#refs/tags/v}"
            echo "Release triggered by tag: $TAG_NAME"
            echo "target=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply Monorepo Version
        id: bump
        run: |
          TARGET="${{ steps.determine_version.outputs.target }}"
          DRY_RUN="${{ steps.determine_version.outputs.dry_run }}"
          
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/bump-version.mjs "$TARGET" --dry-run
          else
            node scripts/bump-version.mjs "$TARGET"
          fi

      - name: Build Monorepo with Verified Version
        run: pnpm run build

      - name: Commit Version Changes and Create Tag
        if: ${{ steps.determine_version.outputs.dry_run == 'false' }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          echo "Processing git release state for v${NEW_VERSION}..."
          
          # Only commit if package.json was modified
          if ! git diff --quiet package.json; then
            git add -A
            git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
            git push origin HEAD:main
          fi

          # Tag if not already present
          if ! git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
            git push origin "v${NEW_VERSION}"
          fi

      - name: Check NPM_TOKEN Secret
        id: check_npm
        shell: bash
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::NPM_TOKEN secret is NOT set in repository secrets. npm publish will be skipped."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish Packages to npm
        if: ${{ steps.determine_version.outputs.dry_run == 'false' && steps.check_npm.outputs.has_token == 'true' }}
        run: |
          echo "🚀 Publishing public workspace packages to npm..."
          pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Packages to npm (Dry Run)
        if: ${{ steps.determine_version.outputs.dry_run == 'true' }}
        run: |
          echo "🏜️ Dry-run mode: checking publishable packages..."
          pnpm -r publish --access public --dry-run --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ steps.determine_version.outputs.dry_run == 'false' }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          echo "Creating GitHub Release for v${NEW_VERSION}..."
          gh release view "v${NEW_VERSION}" >/dev/null 2>&1 || gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          DRY_RUN="${{ steps.determine_version.outputs.dry_run }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "$DRY_RUN" = "true" ]; then
            echo "🏜️ DRY RUN COMPLETE: Packages verified for v${NEW_VERSION}"
          else
            echo "🎉 RELEASE COMPLETE: v${NEW_VERSION} processed successfully!"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
